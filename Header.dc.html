<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    @keyframes duleSheen{0%{transform:translateX(-140%) skewX(-20deg);}60%,100%{transform:translateX(260%) skewX(-20deg);}}
    @keyframes dulePulseDot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,255,255,0.7);}50%{opacity:.55;box-shadow:0 0 0 6px rgba(255,255,255,0);}}
    .dule-burger{display:none;}
    @media(max-width:860px){
      .dule-desktop-nav{display:none!important;}
      .dule-pozovi-text{display:none!important;}
      .dule-pozovi{padding:11px!important;}
      .dule-burger{display:inline-flex!important;}
      .dule-bar-inner{padding:0 18px!important;height:64px!important;}
      .dule-logo{height:44px!important;margin-left:-21px!important;}
    }
  </style>
</helmet>
<header style="position:sticky;top:0;z-index:50;background:#ffffff;border-bottom:1px solid #e6eaef;box-shadow:0 1px 0 rgba(20,40,74,0.04),0 8px 24px -18px rgba(20,40,74,0.35);font-family:'Manrope',sans-serif;">
  <div class="dule-bar-inner" style="max-width:1240px;margin:0 auto;padding:0 32px;height:74px;display:flex;align-items:center;justify-content:space-between;gap:16px;">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;">
      <img src="assets/logo.png" alt="Auto škola Dule" class="dule-logo" style="height:56px;width:auto;display:block;margin-left:-27px;" />
    </a>
    <nav class="dule-desktop-nav" style="display:flex;align-items:center;gap:4px;">
      <sc-for list="{{ items }}" as="item" hint-placeholder-count="5">
        <a href="{{ item.href }}" style="{{ item.style }}" style-hover="color:#e11f2a;">{{ item.label }}</a>
      </sc-for>
    </nav>
    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
      <a href="tel:0606037037" class="dule-pozovi" style="display:inline-flex;align-items:center;justify-content:center;gap:9px;background:#e11f2a;color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:12px 20px;border-radius:10px;letter-spacing:0.2px;box-shadow:0 10px 22px -12px rgba(225,31,42,0.9);position:relative;" style-hover="background:#c4141e;">
        <svg class="dule-phone-ico" width="16" height="16" viewBox="0 0 24 24" fill="#fff" style="flex-shrink:0;display:block;"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1l-2.2 2.2z"/></svg>
        <span class="dule-pozovi-text">Pozovi</span>
      </a>
      <button type="button" class="dule-burger" onClick="{{ toggleMenu }}" aria-label="Meni" style="width:46px;height:46px;border:1px solid #e6eaef;background:#fff;border-radius:11px;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0;">
        <span style="position:relative;display:block;width:20px;height:14px;">
          <span style="{{ barTop }}"></span>
          <span style="{{ barMid }}"></span>
          <span style="{{ barBot }}"></span>
        </span>
      </button>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav style="border-top:1px solid #eef1f5;background:#fff;padding:8px 18px 16px;display:flex;flex-direction:column;gap:2px;">
      <sc-for list="{{ items }}" as="item" hint-placeholder-count="6">
        <a href="{{ item.href }}" style="{{ item.mstyle }}" style-hover="background:#f4f7fb;">{{ item.label }}</a>
      </sc-for>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;74px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pocetna&quot;,&quot;o-nama&quot;,&quot;kategorije&quot;,&quot;galerija&quot;,&quot;cenovnik&quot;,&quot;kontakt&quot;],&quot;default&quot;:&quot;pocetna&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false };
  renderVals() {
    const active = this.props.active || 'pocetna';
    const base = "text-decoration:none;font-weight:600;font-size:15px;padding:9px 14px;border-radius:8px;letter-spacing:0.1px;transition:color .15s;";
    const mbase = "text-decoration:none;font-weight:700;font-size:16.5px;padding:14px 12px;border-radius:10px;transition:background .15s;";
    const nav = [
      { key: 'pocetna', label: 'Početna', href: 'index.html' },
      { key: 'o-nama', label: 'O nama', href: 'o-nama.html' },
      { key: 'kategorije', label: 'Kategorije', href: 'kategorije.html' },
      { key: 'galerija', label: 'Galerija', href: 'galerija.html' },
      { key: 'cenovnik', label: 'Cenovnik', href: 'cenovnik.html' },
      { key: 'kontakt', label: 'Kontakt', href: 'kontakt.html' },
    ];
    const open = this.state.menuOpen;
    const barB = "position:absolute;left:0;width:100%;height:2px;border-radius:2px;background:#14284a;transition:transform .25s,opacity .2s;";
    return {
      menuOpen: open,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      barTop: barB + (open ? "top:6px;transform:rotate(45deg);" : "top:0;"),
      barMid: barB + "top:6px;" + (open ? "opacity:0;" : ""),
      barBot: barB + (open ? "top:6px;transform:rotate(-45deg);" : "top:12px;"),
      items: nav.map(n => ({
        label: n.label,
        href: n.href,
        style: base + (n.key === active ? "color:#14284a;font-weight:700;" : "color:#6b7480;"),
        mstyle: mbase + (n.key === active ? "color:#14284a;background:#f4f7fb;" : "color:#54606f;"),
      })),
    };
  }
}
</script>
</body>
</html>
